name: CI (build all services) · dd-this-2

# Manual trigger — click "Run" in the Actions tab (or the app's CI/CD Pipelines page).
# When this workflow succeeds, the CD workflow fires automatically via workflow_run.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  build-and-push:
    name: Build and push all services
    environment: dd-this-2-dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no stored secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::411232894985:role/gha-manov7723-sys-pyt-app-pyt-app-backend
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag backend image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-backend
          TAG: ${{ github.sha }}
        run: |
          docker build --build-arg REACT_APP_BACKEND_URL="${{ vars.REACT_APP_BACKEND_URL }}" -t "$ECR:$TAG" -t "$ECR:latest" -f "backend/Dockerfile" "backend"

      - name: Scan backend image for vulnerabilities (Trivy)
        continue-on-error: true
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-backend
          TAG: ${{ github.sha }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            "$ECR:$TAG" || echo "::warning::Trivy flagged issues or could not run — non-blocking, see logs."
      - name: Smoke-test backend image before push (waits for HEALTHCHECK)
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-backend
          TAG: ${{ github.sha }}
        run: |
          set -eu
          HAS_HC=$(docker inspect --format='{{if .Config.Healthcheck}}yes{{end}}' "$ECR:$TAG")
          if [ -z "$HAS_HC" ]; then
            echo "::warning::Image has no HEALTHCHECK — cannot smoke-test at build time. Regenerate the Dockerfile from the current template to enable this gate."
            exit 0
          fi
          # Production parity: the deploy manifest runs this image with
          # readOnlyRootFilesystem: true and writable emptyDirs only at the
          # standard paths, so the smoke run must too — a writable smoke run
          # green-lit an image that then died in the hardened pod on
          # 'create cache root /home/node/.cache: Read-only file system'
          # (2026-09-29, team-wallet). mode=0777 (NOT 1777): a Kubernetes
          # emptyDir is world-writable WITHOUT the sticky bit, and that
          # exact bit is observable — swc's cache validator trusts a sticky
          # /tmp and rejects a non-sticky one, so a 1777 smoke passed an
          # image the 0777 pod then crash-looped on. A bare --tmpfs is no
          # good either: it comes up root-owned and unwritable for the
          # image's non-root uid.
          CID=$(docker run -d --rm --read-only \
            --tmpfs /tmp:mode=0777 \
            --tmpfs /var/cache/nginx:mode=0777 \
            --tmpfs /var/run:mode=0777 \
            "$ECR:$TAG")
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          # Give the app a full minute to boot AND go healthy. Bail early
          # on 'unhealthy' or if the container has already exited.
          for i in $(seq 1 30); do
            STATE=$(docker inspect --format='{{.State.Status}}' "$CID" 2>/dev/null || echo missing)
            if [ "$STATE" = "missing" ] || [ "$STATE" = "exited" ]; then
              echo "::error::Container exited before it could report health — the app crashed at boot."
              docker logs "$CID" 2>&1 | tail -80 || true
              exit 1
            fi
            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' "$CID" 2>/dev/null || echo starting)
            echo "attempt $i/30 — state=$STATE health=$HEALTH"
            case "$HEALTH" in
              healthy)
                echo "image backend is healthy — proceeding to push"
                exit 0 ;;
              unhealthy)
                echo "::error::Image reported UNHEALTHY. Recent logs:"
                docker logs "$CID" 2>&1 | tail -80 || true
                exit 1 ;;
            esac
            sleep 2
          done
          echo "::error::Image never reached healthy in 60s. Recent logs:"
          docker logs "$CID" 2>&1 | tail -80 || true
          exit 1
      - name: Push backend image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-backend
          TAG: ${{ github.sha }}
        run: |
          docker push "$ECR:$TAG"
          docker push "$ECR:latest"

      - name: Build and tag frontend image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-frontend
          TAG: ${{ github.sha }}
        run: |
          docker build --build-arg REACT_APP_BACKEND_URL="${{ vars.REACT_APP_BACKEND_URL }}" -t "$ECR:$TAG" -t "$ECR:latest" -f "frontend/Dockerfile" "frontend"

      - name: Scan frontend image for vulnerabilities (Trivy)
        continue-on-error: true
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-frontend
          TAG: ${{ github.sha }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            "$ECR:$TAG" || echo "::warning::Trivy flagged issues or could not run — non-blocking, see logs."
      - name: Smoke-test frontend image before push (waits for HEALTHCHECK)
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-frontend
          TAG: ${{ github.sha }}
        run: |
          set -eu
          HAS_HC=$(docker inspect --format='{{if .Config.Healthcheck}}yes{{end}}' "$ECR:$TAG")
          if [ -z "$HAS_HC" ]; then
            echo "::warning::Image has no HEALTHCHECK — cannot smoke-test at build time. Regenerate the Dockerfile from the current template to enable this gate."
            exit 0
          fi
          # Production parity: the deploy manifest runs this image with
          # readOnlyRootFilesystem: true and writable emptyDirs only at the
          # standard paths, so the smoke run must too — a writable smoke run
          # green-lit an image that then died in the hardened pod on
          # 'create cache root /home/node/.cache: Read-only file system'
          # (2026-09-29, team-wallet). mode=0777 (NOT 1777): a Kubernetes
          # emptyDir is world-writable WITHOUT the sticky bit, and that
          # exact bit is observable — swc's cache validator trusts a sticky
          # /tmp and rejects a non-sticky one, so a 1777 smoke passed an
          # image the 0777 pod then crash-looped on. A bare --tmpfs is no
          # good either: it comes up root-owned and unwritable for the
          # image's non-root uid.
          CID=$(docker run -d --rm --read-only \
            --tmpfs /tmp:mode=0777 \
            --tmpfs /var/cache/nginx:mode=0777 \
            --tmpfs /var/run:mode=0777 \
            "$ECR:$TAG")
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          # Give the app a full minute to boot AND go healthy. Bail early
          # on 'unhealthy' or if the container has already exited.
          for i in $(seq 1 30); do
            STATE=$(docker inspect --format='{{.State.Status}}' "$CID" 2>/dev/null || echo missing)
            if [ "$STATE" = "missing" ] || [ "$STATE" = "exited" ]; then
              echo "::error::Container exited before it could report health — the app crashed at boot."
              docker logs "$CID" 2>&1 | tail -80 || true
              exit 1
            fi
            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' "$CID" 2>/dev/null || echo starting)
            echo "attempt $i/30 — state=$STATE health=$HEALTH"
            case "$HEALTH" in
              healthy)
                echo "image frontend is healthy — proceeding to push"
                exit 0 ;;
              unhealthy)
                echo "::error::Image reported UNHEALTHY. Recent logs:"
                docker logs "$CID" 2>&1 | tail -80 || true
                exit 1 ;;
            esac
            sleep 2
          done
          echo "::error::Image never reached healthy in 60s. Recent logs:"
          docker logs "$CID" 2>&1 | tail -80 || true
          exit 1
      - name: Push frontend image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-frontend
          TAG: ${{ github.sha }}
        run: |
          docker push "$ECR:$TAG"
          docker push "$ECR:latest"
