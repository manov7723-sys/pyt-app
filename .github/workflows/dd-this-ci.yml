# Generated by DeepAgent for project "dd-this" (env "dev").
name: CI (build all services) · dd-this

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build and push all services
    environment: dd-this-dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no stored secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::411232894985:role/gha-manov7723-sys-pyt-app-pyt-app-backend
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # BACKEND
      # --------------------------------------------------

      - name: Build and tag backend image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-backend
          TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg REACT_APP_BACKEND_URL="${{ vars.REACT_APP_BACKEND_URL }}" \
            -t "$ECR:$TAG" \
            -t "$ECR:latest" \
            -f backend/Dockerfile \
            backend

      - name: Scan backend image for vulnerabilities (Trivy)
        continue-on-error: true
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-backend
          TAG: ${{ github.sha }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            "$ECR:$TAG" \
            || echo "::warning::Trivy flagged issues or could not run — non-blocking, see logs."

      - name: Push backend image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-backend
          TAG: ${{ github.sha }}
        run: |
          docker push "$ECR:$TAG"
          docker push "$ECR:latest"

      # --------------------------------------------------
      # FRONTEND
      # --------------------------------------------------

      - name: Build and tag frontend image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-frontend
          TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg REACT_APP_BACKEND_URL="${{ vars.REACT_APP_BACKEND_URL }}" \
            -t "$ECR:$TAG" \
            -t "$ECR:latest" \
            -f frontend/Dockerfile \
            frontend

      - name: Scan frontend image for vulnerabilities (Trivy)
        continue-on-error: true
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-frontend
          TAG: ${{ github.sha }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            "$ECR:$TAG" \
            || echo "::warning::Trivy flagged issues or could not run — non-blocking, see logs."

      - name: Push frontend image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-frontend
          TAG: ${{ github.sha }}
        run: |
          docker push "$ECR:$TAG"
          docker push "$ECR:latest"
