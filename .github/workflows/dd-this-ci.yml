name: CI - Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    environment: dd-this-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::411232894985:role/gha-manov7723-sys-pyt-app-pyt-app-backend
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-backend
          TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR:$TAG" \
            -t "$ECR:latest" \
            -f backend/Dockerfile \
            backend

      - name: Scan backend image
        continue-on-error: true
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-backend
          TAG: ${{ github.sha }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            "$ECR:$TAG" || true

      - name: Push backend image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-backend
          TAG: ${{ github.sha }}
        run: |
          docker push "$ECR:$TAG"
          docker push "$ECR:latest"

      - name: Build frontend image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-frontend
          TAG: ${{ github.sha }}
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
        run: |
          docker build \
            --build-arg REACT_APP_BACKEND_URL="$REACT_APP_BACKEND_URL" \
            -t "$ECR:$TAG" \
            -t "$ECR:latest" \
            -f frontend/Dockerfile \
            frontend

      - name: Scan frontend image
        continue-on-error: true
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-frontend
          TAG: ${{ github.sha }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            "$ECR:$TAG" || true

      - name: Push frontend image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/pyt-app-frontend
          TAG: ${{ github.sha }}
        run: |
          docker push "$ECR:$TAG"
          docker push "$ECR:latest"
